<!DOCTYPE html>
<html>
    <head>
        <title>American Diploma Tansik Egypt 2025</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="The 2025 Egyptian Tansik for American Diploma Students">
        <meta name="geo.region" content="EG">
        <meta name="google-site-verification" content="kC3MD4U9ueDH6G-ekJu2nZVUK-XXSAlPMKfxy8IHWck" />
        <link rel="icon" href="data:,">
        <meta name="robots" content="index, follow">
        <link rel="canonical" href="https://estcalculator.pages.dev/">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>American Diploma Tansik 2025</h1>
        <p>The 2025 Tansik for American Diploma students in Egypt</p>
        <h6><a href="index.html">Calculate EST, SAT, or ACT scores for American students</a></h6>
        <div class="card mt-5 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle text-center" style="font-size: 24px;">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">University</th>
                                <th scope="col">Score (%)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <script type="module">
            import {tansik} from "/script.js";
            let table = document.getElementById("tbody");
            tansik.forEach(e => {
                let row = table.insertRow();
                row.insertCell().textContent = e[0];
                row.insertCell().textContent = e[1];
            });
        </script>
    </body>

</html>
