<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Calculate your Weighted GPA with ease with this simple and fast calculator. Enter all your course grades and get your WGPA in one click."
    />
    <link rel="icon" href="data:," />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://estcalculator.pages.dev/gpa/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weighted GPA Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-dark text-light px-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">EST Score Calculator</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="index.html"
                >Weighted GPA Calculator</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../tansik.html">Tansik 2024-2025</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <div class="container-fluid p-3">
        <h1 class="mb-3 mb-md-4 text-center">Weighted GPA Calculator</h1>
        <p class="text-center mt-2">
          This calculator works for credit-based GPA systems. Simply enter your
          courses, credit hours, and GPA to calculate your weighted average.
        </p>
        <div class="table-responsive">
          <table
            class="table table-dark table-hover table-bordered align-middle text-center"
          >
            <thead class="table-primary text-dark">
              <tr>
                <th>Course No.</th>
                <th>Course Name</th>
                <th>Credit Hours</th>
                <th>GPA</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr>
                <td>1</td>
                <td>
                  <input
                    type="text"
                    class="w-100 form-control form-control-sm bg-dark text-light border-primary text-center"
                    placeholder="Course name (optional)"
                  />
                </td>
                <td>
                  <input
                    type="number"
                    class="ch w-100 form-control form-control-sm bg-dark text-light border-primary text-center"
                    step="0.5"
                    min="0"
                    placeholder="Credit Hours"
                  />
                </td>
                <td>
                  <input
                    type="number"
                    class="gpa w-100 form-control form-control-sm bg-dark text-light border-primary text-center"
                    step="0.01"
                    min="0"
                    placeholder="GPA"
                  />
                </td>
              </tr>
            </tbody>
          </table>
          <div class="d-flex gap-2 mt-2 mt-md-3">
            <button id="addCourse" class="btn btn-primary btn-sm flex-fill">
              ➕ Add Course
            </button>
            <button id="deleteCourse" class="btn btn-danger btn-sm flex-fill">
              🗑️ Delete Course
            </button>
          </div>
          <br />
          <button id="calculate" class="btn btn-primary btn-sm w-100">
            🧮 Calculate
          </button>
        </div>
        <div id="result" class="alert alert-info text-center fw-bold fs-4 mt-3">
          Final GPA: —
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
